name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack (installs pnpm version from package.json packageManager field)
        run: corepack enable pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      # ❌ Removed: npm install -g @expo/cli
      # Expo CLI will be run via pnpm exec instead

      - name: Generate native Android project (expo prebuild)
        run: pnpm exec expo prebuild --platform android --no-install
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Set Gradle JVM memory
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m\n' >> android/gradle.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk notewise.apk

      - name: Upload APK artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: notewise-apk
          path: notewise.apk
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: notewise.apk

      - name: Write job summary with download instructions
        run: |
          echo "## ✅ Android APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your APK has been built and uploaded as a workflow artifact." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to download your APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Click the **Summary** tab at the top of this workflow run page (you may already be there)." >> $GITHUB_STEP_SUMMARY
          echo "2. Scroll to the **Artifacts** section at the bottom of the page." >> $GITHUB_STEP_SUMMARY
          echo "3. Click **notewise-apk** to download the ZIP file." >> $GITHUB_STEP_SUMMARY
          echo "4. Unzip the downloaded file — it contains **notewise.apk**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or use this direct link to the workflow run:" >> $GITHUB_STEP_SUMMARY
          echo "[🔗 Go to this workflow run's artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 How to install on your Android device" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Enable **Install Unknown Apps** (or *Install from Unknown Sources*) in Android Settings." >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer **notewise.apk** to your phone (USB cable, Google Drive, email, etc.)." >> $GITHUB_STEP_SUMMARY
          echo "3. Open the file on your phone and tap **Install**." >> $GITHUB_STEP_SUMMARY
